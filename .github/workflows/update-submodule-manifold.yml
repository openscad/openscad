name: Check for Manifold Release

on:
  schedule:
    - cron: '5 5 1 * *'
  workflow_dispatch:

env:
  DELAY_DAYS: 10
  SUBMODULE_NAME: "Manifold"
  SUBMODULE_REPO: "elalish/manifold"
  SUBMODULE_PATH: "submodules/manifold"

jobs:
  check-and-update-submodule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest upstream release
        id: get-latest-release
        run: |
          LATEST_RELEASE=$(gh release list \
            -R "$SUBMODULE_REPO" \
            --exclude-drafts \
            --exclude-pre-releases \
            --json createdAt,tagName \
            -q "if length == 0 then empty
                elif .[0].createdAt | fromdateiso8601 <= (now - $DELAY_DAYS * 86400) then .[0].tagName
                else empty
                end")
          echo "latest_release=$LATEST_RELEASE" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current submodule commit
        id: get-current-submodule
        run: |
          git submodule update --init --recursive "$SUBMODULE_PATH"
          CURRENT_COMMIT=$(git ls-tree HEAD "$SUBMODULE_PATH" | awk '{print $3}')
          CURRENT_TAG=$(git -C "$SUBMODULE_PATH" tag --points-at "$CURRENT_COMMIT" | head -n1)
          echo "current_commit=$CURRENT_COMMIT" >> $GITHUB_OUTPUT
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT

      - name: Compare releases
        id: compare-releases
        run: |
          LATEST_RELEASE="${{ steps.get-latest-release.outputs.latest_release }}"
          CURRENT_COMMIT="${{ steps.get-current-submodule.outputs.current_commit }}"
          CURRENT_TAG="${{ steps.get-current-submodule.outputs.current_tag }}"
          if [ -z "$LATEST_RELEASE" ]; then
            echo "No release older than ${{ env.DELAY_DAYS }} days. Nothing to do."
            echo "new_release_available=false" >> $GITHUB_OUTPUT
          elif [ -n "$CURRENT_TAG" ] && [ "$(printf '%s\n%s\n' "$CURRENT_TAG" "$LATEST_RELEASE" | sort -V | tail -n1)" != "$LATEST_RELEASE" ]; then
            echo "Candidate $LATEST_RELEASE is not semver-newer than pinned $CURRENT_TAG. Skipping."
            echo "new_release_available=false" >> $GITHUB_OUTPUT
          else
            LATEST_COMMIT=$(git -C "$SUBMODULE_PATH" rev-list -n1 "$LATEST_RELEASE")
            if [ "$LATEST_COMMIT" != "$CURRENT_COMMIT" ]; then
              echo "New release detected: $LATEST_RELEASE ($LATEST_COMMIT, current: $CURRENT_COMMIT)"
              echo "new_release_available=true" >> $GITHUB_OUTPUT
              echo "release_tag=$LATEST_RELEASE" >> $GITHUB_OUTPUT
            else
              echo "No new release detected."
              echo "new_release_available=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Check for existing PR
        id: check-existing-pr
        if: steps.compare-releases.outputs.new_release_available == 'true'
        run: |
          RELEASE_TAG="${{ steps.compare-releases.outputs.release_tag }}"
          EXISTING_PR=$(gh pr list \
            -L1 \
            --json number \
            --jq .[].number \
            --state all \
            --label dependencies \
            --search "in:title Update $SUBMODULE_NAME to $RELEASE_TAG")
          if [ -n "$EXISTING_PR" ]; then
            echo "Existing PR found: #$EXISTING_PR"
            echo "existing_pr=$EXISTING_PR" >> $GITHUB_OUTPUT
          else
            echo "No existing PR found."
            echo "existing_pr=" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodule if new release is available and no PR exists
        if: steps.compare-releases.outputs.new_release_available == 'true' && steps.check-existing-pr.outputs.existing_pr == ''
        run: |
          set -x
          git submodule status
          git -C "$SUBMODULE_PATH" log -n8 --oneline
          git -C "$SUBMODULE_PATH" checkout "${{ steps.compare-releases.outputs.release_tag }}"
          git -C "$SUBMODULE_PATH" log -n8 --oneline

      - name: Create Pull Request
        if: steps.compare-releases.outputs.new_release_available == 'true' && steps.check-existing-pr.outputs.existing_pr == ''
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(submodule): Update ${{ env.SUBMODULE_NAME }} to ${{ steps.compare-releases.outputs.release_tag }}"
          title: "chore(submodule): Update ${{ env.SUBMODULE_NAME }} to ${{ steps.compare-releases.outputs.release_tag }}"
          body: |
            This PR updates the submodule `${{ env.SUBMODULE_NAME }}` from `${{ steps.get-current-submodule.outputs.current_commit }}` to the latest release tag: `${{ steps.compare-releases.outputs.release_tag }}` (Note: Releases are only picked up after a delay of ${{ env.DELAY_DAYS }} days).
            - **Upstream Release**: https://github.com/elalish/manifold/releases/tag/${{ steps.compare-releases.outputs.release_tag }}
          branch: "chore/update-manifold-${{ steps.compare-releases.outputs.release_tag }}"
          labels: |
            dependencies
            Tag: ${{ env.SUBMODULE_NAME }}
