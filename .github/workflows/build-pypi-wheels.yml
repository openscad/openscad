# Build a representative PyPI wheel on pull requests to catch packaging regressions
# before release. The full multi-platform matrix runs in publish-to-pypi.yml.
name: Build PyPI wheels

on:
  push:
    branches:
      - master
    paths:
      - "setup.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "pyrightconfig.json"
      - "libraries/python/openscad/**"
      - "libraries/python/pythonscad/**"
      - "libraries/python/stubs/**"
      - "src/python/**"
      - "scripts/cibuildwheel/**"
      - "scripts/smoke-test-pip.py"
      - "scripts/deps/profiles/pythonscad-pip.json"
      - "tests/typing/**"
      - "uv.lock"
      - ".github/workflows/build-pypi-wheels.yml"
  pull_request:
    paths:
      - "setup.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "pyrightconfig.json"
      - "libraries/python/openscad/**"
      - "libraries/python/pythonscad/**"
      - "libraries/python/stubs/**"
      - "src/python/**"
      - "scripts/cibuildwheel/**"
      - "scripts/smoke-test-pip.py"
      - "scripts/deps/profiles/pythonscad-pip.json"
      - "tests/typing/**"
      - "uv.lock"
      - ".github/workflows/build-pypi-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel-smoke:
    name: cp312 manylinux x86_64 wheel + smoke test
    runs-on: ubuntu-26.04
    env:
      CIBW_BUILD: cp312-manylinux_x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Fetch tags for version detection
        run: |
          git fetch --unshallow --tags || git fetch --tags
          git describe --tags --always --dirty

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install build tooling
        run: uv sync --frozen --only-group build --only-group typing --no-install-project

      - name: Type-check the public Python API
        run: uv run --no-sync pyright --project tests/typing

      - name: Add build tools to PATH
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "${GITHUB_WORKSPACE}/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Build wheel
        uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-wheel-smoke
          path: wheelhouse/*.whl
