<!-- A <use> element inside a group in <defs>, where the group is itself
     referenced by <use> elements. The result is 4 squares in a 2x2 grid. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <defs>
    <g id="square">
      <rect x="0" y="0" width="5" height="5"/>
    </g>
    <g id="pair">
      <use href="#square"/>
      <use href="#square" x="10"/>
    </g>
  </defs>
  <use href="#pair"/>
  <use href="#pair" y="10"/>
</svg>
