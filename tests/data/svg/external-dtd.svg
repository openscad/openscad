<?xml version="1.0"?>
<!-- Security fixture: references an external DTD that defines an entity
     carrying the canary string.  The DTD must not be loaded, and the
     entity must not be substituted. -->
<!DOCTYPE svg SYSTEM "external-dtd.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <rect width="10" height="10"/>
  <text>&dtd_canary;</text>
</svg>
