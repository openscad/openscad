<?xml version="1.0"?>
<!-- Security fixture: declares an external entity pointing at the local
     file "xxe-canary.txt" and references it.  With entity expansion
     enabled (the old behaviour of libsvg's streamFile()), libxml2 reads
     that file and substitutes its content into the text node. -->
<!DOCTYPE svg [
  <!ENTITY xxe SYSTEM "xxe-canary.txt">
]>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <rect width="10" height="10"/>
  <text>&xxe;</text>
</svg>
